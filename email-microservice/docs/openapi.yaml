openapi: 3.0.3
info:
  title: Email Microservice API
  version: 1.0.0
  description: >-
    REST endpoints for service accounts, SMTP sender identities, templates, email delivery,
    and delivery analytics. Email sending is synchronous in the current implementation.
servers:
  - url: http://localhost:3000/api/v1
tags:
  - name: Authentication
  - name: Senders
  - name: Templates
  - name: Emails
  - name: Operations
paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register an email-service user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 50 }
                password: { type: string, format: password, minLength: 8 }
      responses:
        '201': { description: User registered }
        '400': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate and receive a bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '200': { description: JWT and expiry timestamp }
        '401': { $ref: '#/components/responses/Error' }
  /senders/verify:
    post:
      tags: [Senders]
      summary: Add and verify an SMTP sender identity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_name, email, smtp_host, smtp_port, username, password]
              properties:
                admin_name: { type: string }
                email: { type: string, format: email }
                smtp_host: { type: string }
                smtp_port: { type: integer, minimum: 1, maximum: 65535 }
                username: { type: string }
                password: { type: string, format: password }
      responses:
        '201': { description: Verified sender identity }
        '401': { $ref: '#/components/responses/Error' }
  /senders/:
    get:
      tags: [Senders]
      summary: List the authenticated user's verified senders
      responses:
        '200': { description: Sender identities }
  /senders/{email}:
    delete:
      tags: [Senders]
      summary: Delete a sender identity
      parameters:
        - { in: path, name: email, required: true, schema: { type: string, format: email } }
      responses:
        '200': { description: Sender deleted }
        '404': { $ref: '#/components/responses/Error' }
  /templates/:
    post:
      tags: [Templates]
      summary: Create an email template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '201': { description: Template created }
    get:
      tags: [Templates]
      summary: List templates
      responses:
        '200': { description: Template list }
  /templates/{id}:
    get:
      tags: [Templates]
      summary: Get a template
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Template }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [Templates]
      summary: Update a template
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TemplateInput' }
      responses:
        '200': { description: Updated template }
    delete:
      tags: [Templates]
      summary: Delete a template
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses:
        '200': { description: Template deleted }
  /emails/send:
    post:
      tags: [Emails]
      summary: Send email through a verified sender
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, subject, body]
              properties:
                from: { type: string, format: email }
                to: { type: array, minItems: 1, items: { type: string, format: email } }
                subject: { type: string, minLength: 1, maxLength: 255 }
                body: { type: string }
                format: { type: string, enum: [text, html], default: text }
      responses:
        '200': { description: Delivery attempt summary }
        '400': { $ref: '#/components/responses/Error' }
  /emails/metrics:
    get:
      tags: [Emails]
      summary: Get aggregate metrics for the authenticated admin
      responses:
        '200': { description: Metrics grouped by sender }
  /emails/metrics/{senderEmail}:
    get:
      tags: [Emails]
      summary: Get metrics for one sender identity
      parameters:
        - { in: path, name: senderEmail, required: true, schema: { type: string, format: email } }
      responses:
        '200': { description: Sender metrics }
        '404': { $ref: '#/components/responses/Error' }
  /health:
    get:
      tags: [Operations]
      summary: Liveness check
      security: []
      responses:
        '200': { description: Service is running }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: API error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
              message: { type: string }
              status: { type: integer }
  schemas:
    TemplateInput:
      type: object
      required: [name, subject, body, format]
      properties:
        name: { type: string }
        subject: { type: string }
        body: { type: string }
        format: { type: string, enum: [text, html] }
security:
  - bearerAuth: []
