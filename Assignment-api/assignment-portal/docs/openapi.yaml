openapi: 3.0.3
info:
  title: Assignment Portal API
  version: 1.0.0
  description: >-
    Documents the HTTP handlers registered by this module. Service-backed
    tenant and assignment workflows require the SQL schema described in
    docs/database.md. Legacy assistant/media handlers have the limitations
    listed in OPERATIONS.md.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Tenants
  - name: Assignments
  - name: Submissions
  - name: Legacy assistant and media
paths:
  /signup:
    post:
      tags: [Authentication]
      summary: Register a legacy default-tenant user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                role: { type: string, enum: [user, admin] }
                branch: { type: string }
                semester: { type: integer }
      responses:
        '201': { description: User created }
        '400': { description: Invalid input }
  /login:
    post:
      tags: [Authentication]
      summary: Authenticate a legacy user
      security: []
      description: If an email belongs to multiple tenants, provide tenant_id to select the intended account. A unique match needs no tenant_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                tenant_id: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
      responses:
        '200': { description: Login succeeded; returns a bearer token }
        '401': { description: Invalid credentials }
  /tenants:
    post:
      tags: [Tenants]
      summary: Create a tenant and send an owner invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, owner_email]
              properties:
                tenant_id: { type: string }
                name: { type: string }
                owner_email: { type: string, format: email }
      responses:
        '201': { description: Tenant created and invitation sent }
        '400': { description: Invalid tenant request }
  /tenant-invitations/accept:
    post:
      tags: [Tenants]
      summary: Accept an invitation and receive a tenant bearer token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string, format: password }
                branch: { type: string }
                semester: { type: integer }
      responses:
        '201': { description: Invitation accepted }
        '400': { description: Invalid or expired invitation }
  /tenant/invitations:
    post:
      tags: [Tenants]
      summary: Invite a member to the active tenant
      description: Requires an administrator bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [user, admin] }
                name: { type: string }
                branch: { type: string }
                semester: { type: integer }
                course_id: { type: string, format: uuid }
      responses:
        '201': { description: Invitation created }
        '401': { description: Authentication required }
        '403': { description: Administrator access required }
  /admin/invitations/bulk:
    post:
      tags: [Tenants]
      summary: Invite multiple members
      description: Service validation currently limits imports to 200 entries.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invitations]
              properties:
                invitations:
                  type: array
                  items:
                    type: object
                    required: [email]
                    properties:
                      email: { type: string, format: email }
                      role: { type: string, enum: [user, admin] }
                      name: { type: string }
                      branch: { type: string }
                      semester: { type: integer }
                      course_id: { type: string, format: uuid }
      responses:
        '201': { description: Invitations processed }
        '400': { description: Invalid request }
        '403': { description: Administrator access required }
  /admin/roster/import:
    post:
      tags: [Tenants]
      summary: Import a roster from CSV
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201': { description: Roster import processed }
        '400': { description: Invalid CSV or missing file }
        '403': { description: Administrator access required }
  /admin/courses:
    get:
      tags: [Tenants]
      summary: List courses in the active tenant
      responses:
        '200': { description: Course list }
        '403': { description: Administrator access required }
    post:
      tags: [Tenants]
      summary: Create a course in the active tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, name, branch, semester]
              properties:
                code: { type: string }
                name: { type: string }
                branch: { type: string }
                semester: { type: integer }
      responses:
        '201': { description: Course created }
        '400': { description: Invalid course request }
        '403': { description: Administrator access required }
  /admin/users:
    get:
      tags: [Tenants]
      summary: List members in the active tenant
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, verified, revoked] } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200': { description: Paginated member list }
        '403': { description: Administrator access required }
  /admin/users/{user_id}/status:
    post:
      tags: [Tenants]
      summary: Change a tenant member's status
      parameters:
        - { in: path, name: user_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [verified, revoked] }
      responses:
        '200': { description: Membership updated }
        '400': { description: Invalid user or status }
        '403': { description: Administrator access required }
  /admin/getassignments:
    get:
      tags: [Assignments]
      summary: List assignments in the active tenant
      parameters:
        - { in: query, name: branch, schema: { type: string } }
        - { in: query, name: semester, schema: { type: integer } }
        - { in: query, name: subject_code, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200': { description: Paginated assignment list }
        '403': { description: Administrator access required }
  /admin/assign_assignments:
    post:
      tags: [Assignments]
      summary: Create an assignment and target matching students
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentCreateRequest' }
      responses:
        '200': { description: Assignment and notification summary }
        '400': { description: Invalid assignment request }
        '403': { description: Administrator access required }
  /admin/submissions:
    get:
      tags: [Submissions]
      summary: List pending submissions for an assignment
      parameters:
        - { in: query, name: assignment_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, default: 25, maximum: 100 } }
      responses:
        '200': { description: Paginated pending submissions }
        '400': { description: Invalid assignment_id }
        '403': { description: Administrator access required }
  /admin/submissions/grade:
    post:
      tags: [Submissions]
      summary: Grade a submission
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeSubmissionRequest' }
      responses:
        '200': { description: Submission graded }
        '400': { description: Invalid grading request }
        '403': { description: Administrator access required }
  /admin/assignments/accept:
    post:
      tags: [Submissions]
      summary: Accept legacy submissions by student ID
      parameters:
        - { in: query, name: id, required: true, description: Comma-separated student UUIDs, schema: { type: string } }
      responses:
        '200': { description: Submissions accepted }
        '403': { description: Administrator access required }
  /admin/assignments/reject:
    post:
      tags: [Submissions]
      summary: Reject legacy submissions by student ID
      parameters:
        - { in: query, name: id, required: true, description: Comma-separated student UUIDs, schema: { type: string } }
        - { in: query, name: reason, schema: { type: string } }
      responses:
        '200': { description: Submissions rejected }
        '403': { description: Administrator access required }
  /user/upload:
    post:
      tags: [Submissions]
      summary: Submit files for the authenticated user
      description: Stores uploaded files locally and applies the assignment's due-date and resubmission rules. No GCS, malware scanning, or signed download is implemented.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [assignment_id, image, file]
              properties:
                assignment_id: { type: string, format: uuid }
                comments: { type: string }
                image: { type: string, format: binary }
                file: { type: string, format: binary }
      responses:
        '201': { description: Submission stored }
        '400': { description: Missing or invalid upload data }
  /user/assignments/{user_id}:
    get:
      tags: [Assignments]
      summary: List legacy assignment submissions for a user
      parameters:
        - { in: path, name: user_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Assignment submission list }
        '403': { description: User access required }
  /user/dashboard:
    get:
      tags: [Assignments]
      summary: Get the active user's assignment dashboard
      responses:
        '200': { description: Dashboard summary and assignment buckets }
        '403': { description: User access required }
  /user/submissions/{submission_id}/revisions:
    get:
      tags: [Submissions]
      summary: List previous attempts for a submission
      parameters:
        - { in: path, name: submission_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Submission revision history }
        '403': { description: User access required }
  /user/admins:
    get:
      tags: [Assignments]
      summary: List legacy administrator accounts
      responses:
        '200': { description: Administrator list }
        '403': { description: User access required }
  /user/aid/upload:
    post:
      tags: [Legacy assistant and media]
      summary: Send a question to the RAG service
      description: Uses the RAG gRPC service at localhost:50052; clients should treat this endpoint as legacy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '200': { description: RAG answer }
        '403': { description: User access required }
  /admin/aid/uploadFile:
    post:
      tags: [Legacy assistant and media]
      summary: Upload documents to the RAG service
      description: Requires the RAG gRPC service at localhost:50052.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, items: { type: string, format: binary } }
      responses:
        '200': { description: RAG upload completed }
        '403': { description: Administrator access required }
  /admin/aid/getPresignedURL:
    post:
      tags: [Legacy assistant and media]
      summary: Legacy video upload URL handler
      description: Not a supported upload flow; current implementation uses placeholder bucket and signing credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description]
              properties:
                url: { type: string, format: uri }
                title: { type: string, description: Must end in .mp4 }
                description: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '200': { description: Handler response }
        '403': { description: Administrator access required }
  /admin/aid/getData:
    post:
      tags: [Legacy assistant and media]
      summary: Legacy analytics handler (not recommended)
      description: The handler asks a local Ollama instance to generate SQL and executes the result; it is not a fixed, parameterized report API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string }
      responses:
        '200': { description: Handler result; do not expose to untrusted callers }
        '403': { description: Administrator access required }
  /aid/video/{id}/status:
    put:
      tags: [Legacy assistant and media]
      summary: Start legacy video processing
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Processing request accepted }
        '403': { description: Administrator access required }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AssignmentCreateRequest:
      type: object
      required: [email, task, due_date, subject_code]
      properties:
        email: { type: string, format: email }
        task: { type: string }
        due_date: { type: string, format: date-time }
        branch: { type: string }
        semester: { type: integer, minimum: 1, maximum: 20 }
        subject_code: { type: string }
        course_id: { type: string, format: uuid }
        max_score: { type: number, default: 100 }
        late_policy: { type: string, enum: [allow, reject, penalty], default: allow }
        late_penalty_percent: { type: number, minimum: 0, maximum: 100, default: 0 }
        allow_resubmission: { type: boolean, default: false }
        max_attempts: { type: integer, minimum: 1, maximum: 20, default: 1 }
        reminder_hours: { type: integer, minimum: 1, maximum: 720, default: 48 }
        rubrics:
          type: array
          items:
            type: object
            required: [criterion, max_points]
            properties:
              criterion: { type: string }
              description: { type: string }
              max_points: { type: number }
    GradeSubmissionRequest:
      type: object
      required: [assignment_id, user_id]
      properties:
        assignment_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected], default: accepted }
        score: { type: number }
        feedback: { type: string }
        rubric_scores:
          type: array
          items:
            type: object
            required: [rubric_id, points]
            properties:
              rubric_id: { type: string, format: uuid }
              points: { type: number, minimum: 0 }
