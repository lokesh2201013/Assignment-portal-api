openapi: 3.0.3
info:
  title: Assignment Portal API
  version: 1.0.0
  description: >-
    Tenant-aware assignment, submission, upload, video-ingestion, and assistant APIs.
    Protected routes use a JWT bearer token. Tenant scope comes from the validated token.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Authentication
  - name: Tenants
  - name: Assignments
  - name: Submissions
  - name: Assistant and media
paths:
  /signup:
    post:
      tags: [Authentication]
      summary: Register a user in the default tenant
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { description: User created }
        '400': { $ref: '#/components/responses/Error' }
  /login:
    post:
      tags: [Authentication]
      summary: Authenticate and issue a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { description: Authenticated; returns token }
        '401': { $ref: '#/components/responses/Error' }
  /tenants:
    post:
      tags: [Tenants]
      summary: Create a tenant and email an owner invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenant_id, name, owner_email]
              properties:
                tenant_id: { type: string, pattern: '^[a-z0-9][a-z0-9-]{2,62}$' }
                name: { type: string }
                owner_email: { type: string, format: email }
      responses:
        '201': { description: Tenant created and invitation sent }
        '400': { $ref: '#/components/responses/Error' }
  /tenant-invitations/accept:
    post:
      tags: [Tenants]
      summary: Accept an owner or member invitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, name, password]
              properties:
                token: { type: string }
                name: { type: string }
                password: { type: string, format: password }
                branch: { type: string }
                semester: { type: integer }
      responses:
        '201': { description: Membership activated; returns tenant, role, and JWT }
        '400': { $ref: '#/components/responses/Error' }
  /tenant/invitations:
    post:
      tags: [Tenants]
      summary: Invite a user or administrator to the current tenant
      description: Requires an administrator JWT. Invitation roles are user or admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email: { type: string, format: email }
                role: { type: string, enum: [user, admin] }
      responses:
        '201': { description: Invitation created }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/invitations/bulk:
    post:
      tags: [Tenants]
      summary: Bulk invite users or administrators to the tenant
      description: Allows inviting up to 200 users at once with role, branch, semester, and course assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkInvitationRequest' }
      responses:
        '200':
          description: Summary of invited and skipped invitations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterImportResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/roster/import:
    post:
      tags: [Tenants]
      summary: Import a student roster from a CSV file
      description: Parses a CSV file (header with email required; optional name, role, branch, semester, course_id).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: CSV roster file up to 200 entries }
      responses:
        '201':
          description: Roster import processed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RosterImportResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/courses:
    post:
      tags: [Tenants]
      summary: Create a course or class
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseCreateRequest' }
      responses:
        '201':
          description: Course created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Course' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      tags: [Tenants]
      summary: List all courses in the tenant
      responses:
        '200':
          description: List of courses
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Course' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users:
    get:
      tags: [Tenants]
      summary: List tenant members
      description: Returns members filtered optionally by status (pending, verified, revoked).
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [pending, verified, revoked] } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Paginated member list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TenantMember' }
                  page: { $ref: '#/components/schemas/PageMetadata' }
        '403': { $ref: '#/components/responses/Error' }
  /admin/users/{user_id}/status:
    post:
      tags: [Tenants]
      summary: Manage or deactivate member status
      description: Activate or deactivate a tenant user. Administrators cannot deactivate themselves or the last remaining administrator.
      parameters:
        - { in: path, name: user_id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MembershipStatusRequest' }
      responses:
        '200': { description: Member status updated }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /admin/getassignments:
    get:
      tags: [Assignments]
      summary: List tenant assignments
      parameters:
        - { in: query, name: branch, schema: { type: string } }
        - { in: query, name: semester, schema: { type: integer } }
        - { in: query, name: subject_code, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated assignments }
        '403': { $ref: '#/components/responses/Error' }
  /admin/assign_assignments:
    post:
      tags: [Assignments]
      summary: Assign work to matching students
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignmentCreateRequest' }
      responses:
        '200': { description: Assignment and notification summary }
        '400': { $ref: '#/components/responses/Error' }
  /admin/submissions:
    get:
      tags: [Submissions]
      summary: List pending submissions for an assignment
      parameters:
        - { in: query, name: assignment_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated submissions }
        '400': { $ref: '#/components/responses/Error' }
  /admin/assignments/accept:
    post:
      tags: [Submissions]
      summary: Accept submissions
      parameters:
        - { in: query, name: assignment_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: id, required: true, description: Comma-separated student UUIDs, schema: { type: string } }
      responses:
        '200': { description: Submissions accepted }
  /admin/assignments/reject:
    post:
      tags: [Submissions]
      summary: Reject submissions
      parameters:
        - { in: query, name: assignment_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: id, required: true, description: Comma-separated student UUIDs, schema: { type: string } }
        - { in: query, name: reason, schema: { type: string } }
      responses:
        '200': { description: Submissions rejected }
  /admin/submissions/grade:
    post:
      tags: [Submissions]
      summary: Grade a student submission
      description: Record marks/score or individual rubric points, status (accepted or rejected), and written feedback. Late penalties are automatically applied if the assignment policy is penalty.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GradeSubmissionRequest' }
      responses:
        '200': { description: Submission graded }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/upload:
    post:
      tags: [Submissions]
      summary: Submit assignment files
      description: Requires a user JWT. Upload both an image and a document; configured size, due date, resubmission limits, and malware checks apply.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [assignment_id, image, file]
              properties:
                assignment_id: { type: string, format: uuid }
                comments: { type: string }
                image: { type: string, format: binary }
                file: { type: string, format: binary }
      responses:
        '201': { description: Submission created }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/dashboard:
    get:
      tags: [Assignments]
      summary: Retrieve learner dashboard
      description: Single unified view for learners with upcoming tasks, overdue work, submissions pending review, graded work with marks and feedback, and approaching deadline reminders.
      responses:
        '200':
          description: Learner dashboard overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LearnerDashboard' }
        '401': { $ref: '#/components/responses/Error' }
  /user/assignments:
    get:
      tags: [Assignments]
      summary: List the authenticated user's assignments
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated assignments and submissions }
  /user/assignments/{user_id}:
    get:
      tags: [Assignments]
      summary: Legacy user-scoped assignment list
      description: The path user_id must match the authenticated principal. Prefer /user/assignments.
      parameters:
        - { in: path, name: user_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, default: 1 } }
        - { in: query, name: limit, schema: { type: integer, maximum: 100, default: 25 } }
      responses:
        '200': { description: Paginated assignments and submissions }
        '403': { $ref: '#/components/responses/Error' }
  /user/submissions/{submission_id}/download:
    get:
      tags: [Submissions]
      summary: Get a short-lived download URL for an owned submission file
      parameters:
        - { in: path, name: submission_id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: file, schema: { type: string, enum: [submission, image], default: submission } }
      responses:
        '200': { description: Signed download URL, valid for five minutes }
        '404': { $ref: '#/components/responses/Error' }
  /user/submissions/{submission_id}/revisions:
    get:
      tags: [Submissions]
      summary: Get previous revision attempts for a submission
      parameters:
        - { in: path, name: submission_id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Revisions history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/SubmissionRevision' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /user/admins:
    get:
      tags: [Assignments]
      summary: List administrators in the current tenant
      responses:
        '200': { description: Administrator list }
  /admin/aid/getPresignedURL:
    post:
      tags: [Assistant and media]
      summary: Create a signed video upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, title]
              properties:
                url: { type: string, format: uri }
                title: { type: string }
                description: { type: string }
                tags: { type: array, items: { type: string } }
      responses:
        '200': { description: Signed upload URL and video ID }
  /admin/aid/uploadFile:
    post:
      tags: [Assistant and media]
      summary: Send uploaded documents to the RAG service
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files: { type: array, items: { type: string, format: binary } }
      responses:
        '200': { description: Documents processed }
  /admin/aid/getData:
    post:
      tags: [Assistant and media]
      summary: Run one approved tenant-scoped analytics report
      description: Legacy GET is retained, but POST is recommended for Swagger and clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, enum: [assignments_by_branch, submission_status, overdue_assignments] }
      responses:
        '200': { description: Fixed report result and report identifier }
        '400': { $ref: '#/components/responses/Error' }
  /user/aid/upload:
    post:
      tags: [Assistant and media]
      summary: Ask the RAG assistant a question
      description: Legacy GET is retained, but POST is recommended for Swagger and clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 4000 }
      responses:
        '200': { description: Assistant answer }
  /aid/video/status:
    put:
      tags: [Assistant and media]
      summary: Start processing for a video ID
      parameters:
        - { in: query, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Processing request accepted }
  /metrics:
    get:
      tags: [Assistant and media]
      summary: Prometheus request counters
      security: []
      responses:
        '200': { description: Prometheus text exposition format, content: { text/plain: { schema: { type: string } } } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Error:
      description: Request or authorization error
      content:
        application/json:
          schema:
            type: object
            properties:
              error: { type: string }
  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password, role]
      properties:
        tenant_id: { type: string, description: Registration is restricted to the default tenant }
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        role: { type: string, enum: [user, admin] }
        branch: { type: string }
        semester: { type: integer }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        tenant_id: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
    AssignmentCreateRequest:
      type: object
      required: [email, task, due_date, subject_code]
      properties:
        email: { type: string, format: email }
        task: { type: string }
        due_date: { type: string, format: date-time, description: RFC3339 due date }
        branch: { type: string, description: Required unless course_id is provided }
        semester: { type: integer, minimum: 1, maximum: 20, description: Required unless course_id is provided }
        subject_code: { type: string }
        course_id: { type: string, format: uuid, description: Course scope identifier }
        max_score: { type: number, minimum: 0.1, default: 100 }
        late_policy: { type: string, enum: [allow, reject, penalty], default: allow }
        late_penalty_percent: { type: number, minimum: 0, maximum: 100, default: 0 }
        allow_resubmission: { type: boolean, default: false }
        max_attempts: { type: integer, minimum: 1, maximum: 20, default: 1 }
        reminder_hours: { type: integer, minimum: 1, maximum: 720, default: 48 }
        rubrics:
          type: array
          items: { $ref: '#/components/schemas/RubricRequest' }
    RubricRequest:
      type: object
      required: [criterion, max_points]
      properties:
        criterion: { type: string }
        description: { type: string }
        max_points: { type: number, minimum: 0.1 }
    RubricScoreInput:
      type: object
      required: [rubric_id, points]
      properties:
        rubric_id: { type: string, format: uuid }
        points: { type: number, minimum: 0 }
    GradeSubmissionRequest:
      type: object
      required: [assignment_id, user_id]
      properties:
        assignment_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [accepted, rejected], default: accepted }
        score: { type: number, minimum: 0, description: Required for acceptance unless rubric_scores provided }
        feedback: { type: string }
        rubric_scores:
          type: array
          items: { $ref: '#/components/schemas/RubricScoreInput' }
    CourseCreateRequest:
      type: object
      required: [code, name, branch, semester]
      properties:
        code: { type: string }
        name: { type: string }
        branch: { type: string }
        semester: { type: integer, minimum: 1, maximum: 20 }
    Course:
      type: object
      properties:
        course_id: { type: string, format: uuid }
        tenant_id: { type: string }
        code: { type: string }
        name: { type: string }
        branch: { type: string }
        semester: { type: integer }
        created_by: { type: string, format: uuid }
        created_at: { type: string }
    TenantMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        tenant_id: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [pending, verified, revoked] }
        branch: { type: string }
        semester: { type: integer }
    MembershipStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [verified, revoked] }
    InvitationEntry:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
        role: { type: string, enum: [user, admin], default: user }
        name: { type: string }
        branch: { type: string }
        semester: { type: integer }
        course_id: { type: string, format: uuid }
    BulkInvitationRequest:
      type: object
      required: [invitations]
      properties:
        invitations:
          type: array
          items: { $ref: '#/components/schemas/InvitationEntry' }
    RosterImportResult:
      type: object
      properties:
        invited: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items: { type: string }
    PageMetadata:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }
    SubmissionRevision:
      type: object
      properties:
        revision_id: { type: string, format: uuid }
        submission_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        attempt_number: { type: integer }
        status: { type: string }
        file: { type: string }
        image: { type: string }
        comments: { type: string }
        feedback: { type: string }
        score: { type: number, nullable: true }
        late_submission: { type: boolean }
        created_at: { type: string }
        replaced_at: { type: string }
    DashboardItem:
      type: object
      properties:
        submission_id: { type: string, format: uuid }
        assignment_id: { type: string, format: uuid }
        task: { type: string }
        subject_code: { type: string }
        due_date: { type: string }
        status: { type: string }
        submitted: { type: boolean }
        late: { type: boolean }
        score: { type: number, nullable: true }
        max_score: { type: number }
        feedback: { type: string }
        hours_until_due: { type: number }
        reminder_hours: { type: integer }
        attempt_number: { type: integer }
        allow_resubmission: { type: boolean }
    DashboardSummary:
      type: object
      properties:
        upcoming: { type: integer }
        overdue: { type: integer }
        pending_review: { type: integer }
        graded: { type: integer }
    LearnerDashboard:
      type: object
      properties:
        summary: { $ref: '#/components/schemas/DashboardSummary' }
        upcoming:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
        overdue:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
        pending_review:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
        graded:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
        reminders:
          type: array
          items: { $ref: '#/components/schemas/DashboardItem' }
